<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expanding Bottom Bar Modal</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: #f3f4f6;
    height: 100vh;
    padding: 20px;
  }

  /* Darkened background overlay */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 998;
  }

  .backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* The Floating Bar / Modal Container */
  .floating-modal {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    
    /* Initial Bar Dimensions */
    width: 320px;
    height: 56px;
    border-radius: 28px;
    
    background: #111827;
    color: #ffffff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    cursor: pointer;
    z-index: 999;

    /* Smooth spring-like transition */
    transition: 
      width 0.4s cubic-bezier(0.32, 0.72, 0, 1),
      height 0.4s cubic-bezier(0.32, 0.72, 0, 1),
      bottom 0.4s cubic-bezier(0.32, 0.72, 0, 1),
      border-radius 0.4s cubic-bezier(0.32, 0.72, 0, 1),
      background-color 0.3s ease;
  }

  /* Expanded Modal State */
  .floating-modal.expanded {
    bottom: 20px;
    width: min(92vw, 480px);
    height: 420px;
    border-radius: 24px;
    background: #ffffff;
    color: #111827;
    cursor: default;
  }

  /* Compact Bar Content */
  .bar-header {
    height: 56px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 500;
    transition: opacity 0.2s ease;
  }

  .floating-modal.expanded .bar-header {
    display: none;
  }

  /* Expanded Modal Content */
  .modal-content {
    opacity: 0;
    pointer-events: none;
    padding: 24px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: opacity 0.25s ease 0.1s;
  }

  .floating-modal.expanded .modal-content {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 16px;
  }

  .close-btn {
    background: #f3f4f6;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .close-btn:hover {
    background: #e5e7eb;
  }

  .modal-body {
    flex: 1;
    padding: 20px 0;
    color: #4b5563;
    line-height: 1.5;
  }

  .action-btn {
    width: 100%;
    padding: 12px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>

  <h2>Page Content</h2>
  <p>Click the floating bar at the bottom to expand it into a modal.</p>

  <!-- Backdrop -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Floating Bar that expands into Modal -->
  <div class="floating-modal" id="floatingModal" role="dialog" aria-expanded="false">
    
    <!-- Collapsed View -->
    <div class="bar-header">
      <span>Quick Actions</span>
      <span>▲</span>
    </div>

    <!-- Expanded View -->
    <div class="modal-content">
      <div class="modal-top">
        <h3>Modal Title</h3>
        <button class="close-btn" id="closeBtn" aria-label="Close modal">✕</button>
      </div>
      
      <div class="modal-body">
        <p>Your floating bar has smoothly expanded into a modal window. You can place forms, settings, or details inside this container.</p>
      </div>

      <button class="action-btn" id="confirmBtn">Done</button>
    </div>

  </div>

  <script>
    const modal = document.getElementById('floatingModal');
    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('closeBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    function openModal() {
      if (!modal.classList.contains('expanded')) {
        modal.classList.add('expanded');
        backdrop.classList.add('active');
        modal.setAttribute('aria-expanded', 'true');
      }
    }

    function closeModal(e) {
      e.stopPropagation(); // Prevent triggering openModal on parent
      modal.classList.remove('expanded');
      backdrop.classList.remove('active');
      modal.setAttribute('aria-expanded', 'false');
    }

    modal.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    confirmBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('expanded')) {
        closeModal(e);
      }
    });
  </script>

</body>
</html>
